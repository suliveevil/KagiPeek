name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      # Both legs must report independently: one leg's failure says which toolchain
      # regressed, and cancelling the sibling would throw that signal away.
      fail-fast: false
      matrix:
        # macos-15 carries the oldest supported toolchain (Xcode 16.4 / Swift 6.1) and
        # macos-26 the newest stable one. The span between them is exactly where
        # toolchain-only failures live — the v2.2.0 event-mask type-check timeout was
        # 16.4-only, and the actor-isolation warnings were 26+-only.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app (Debug)
        run: |
          set +e
          xcodebuild \
            -project KagiPeek.xcodeproj \
            -scheme KagiPeek \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          tail -80 "$RUNNER_TEMP/build.log"
          if [ $status -ne 0 ]; then
            summary=$(grep -E "error:|error " "$RUNNER_TEMP/build.log" | head -8 | tr '\n' ' ' | cut -c1-900)
            if [ -z "$summary" ]; then
              summary=$(tail -20 "$RUNNER_TEMP/build.log" | tr '\n' ' ' | cut -c1-900)
            fi
            echo "::error title=xcodebuild failed::$summary"
            exit $status
          fi

      # Debug-only CI would miss anything that only breaks under optimisation, whole-module
      # builds or the Release-only hardening settings.
      - name: Build app (Release)
        run: |
          xcodebuild \
            -project KagiPeek.xcodeproj \
            -scheme KagiPeek \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-release" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build | tail -40

      - name: Run unit tests
        run: swift test

      # The DMG is the artifact users download. This runs the same script a release runs
      # (it falls back to ad-hoc signing — CI has no identities), then checks the DMG
      # against its own published checksum, so a broken packaging path fails here instead
      # of at publish time. One leg is enough; macos-15 doubles as the oldest toolchain.
      - name: Verify release packaging (DMG)
        if: matrix.os == 'macos-15'
        run: |
          ./scripts/build_release.sh
          shasum -a 256 -c build/KagiPeek-*.dmg.sha256

      - name: Coverage (pure logic)
        run: |
          swift test --enable-code-coverage > /dev/null
          BIN_PATH="$(swift build --show-bin-path)"
          BUNDLE="$(find "$BIN_PATH" -maxdepth 1 -name '*.xctest' -print -quit)"
          PROFILE="$BIN_PATH/codecov/default.profdata"
          if [ -z "$BUNDLE" ] || [ ! -f "$PROFILE" ]; then
            echo "::error title=coverage::coverage artefacts not found"
            exit 1
          fi
          BIN="$BUNDLE/Contents/MacOS/$(basename "$BUNDLE" .xctest)"
          if [ ! -x "$BIN" ]; then
            echo "::error title=coverage::test binary not found in $BUNDLE"
            exit 1
          fi
          xcrun llvm-cov report "$BIN" -instr-profile "$PROFILE" \
            -ignore-filename-regex 'Tests/' | tee "$RUNNER_TEMP/coverage.txt"
          # JSON keeps the lines field stable when llvm-cov adds/removes table columns.
          TOTAL=$(xcrun llvm-cov export "$BIN" -instr-profile "$PROFILE" \
            -ignore-filename-regex 'Tests/' \
            | python3 -c 'import json, sys; print("{:.2f}".format(json.load(sys.stdin)["data"][0]["totals"]["lines"]["percent"]))')
          echo "Core/Pure line coverage: ${TOTAL}%"
          # Hard gate since the v2.3.0 refactor: pure code is the only target with a test
          # runner, so a drop below the floor must fail the job, not just warn.
          if ! python3 -c 'import sys; sys.exit(0 if float(sys.argv[1]) >= 70 else 1)' "$TOTAL"; then
            echo "::error title=coverage::Core/Pure coverage dropped below 70% (${TOTAL}%)"
            exit 1
          fi

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (macOS 15)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app (Debug)
        run: |
          set +e
          xcodebuild \
            -project KagiPeek.xcodeproj \
            -scheme KagiPeek \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          tail -80 "$RUNNER_TEMP/build.log"
          if [ $status -ne 0 ]; then
            summary=$(grep -E "error:|error " "$RUNNER_TEMP/build.log" | head -8 | tr '\n' ' ' | cut -c1-900)
            if [ -z "$summary" ]; then
              summary=$(tail -20 "$RUNNER_TEMP/build.log" | tr '\n' ' ' | cut -c1-900)
            fi
            echo "::error title=xcodebuild failed::$summary"
            exit $status
          fi

      # Debug-only CI would miss anything that only breaks under optimisation, whole-module
      # builds or the Release-only hardening settings.
      - name: Build app (Release)
        run: |
          xcodebuild \
            -project KagiPeek.xcodeproj \
            -scheme KagiPeek \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-release" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build | tail -40

      - name: Run unit tests
        run: swift test

      - name: Coverage (pure logic)
        run: |
          swift test --enable-code-coverage > /dev/null
          BIN_PATH="$(swift build --show-bin-path)"
          BUNDLE="$(find "$BIN_PATH" -maxdepth 1 -name '*.xctest' -print -quit)"
          PROFILE="$BIN_PATH/codecov/default.profdata"
          if [ -z "$BUNDLE" ] || [ ! -f "$PROFILE" ]; then
            echo "::error title=coverage::coverage artefacts not found"
            exit 1
          fi
          BIN="$BUNDLE/Contents/MacOS/$(basename "$BUNDLE" .xctest)"
          if [ ! -x "$BIN" ]; then
            echo "::error title=coverage::test binary not found in $BUNDLE"
            exit 1
          fi
          xcrun llvm-cov report "$BIN" -instr-profile "$PROFILE" \
            -ignore-filename-regex 'Tests/' | tee "$RUNNER_TEMP/coverage.txt"
          # JSON keeps the lines field stable when llvm-cov adds/removes table columns.
          TOTAL=$(xcrun llvm-cov export "$BIN" -instr-profile "$PROFILE" \
            -ignore-filename-regex 'Tests/' \
            | python3 -c 'import json, sys; print("{:.2f}".format(json.load(sys.stdin)["data"][0]["totals"]["lines"]["percent"]))')
          echo "Core/Pure line coverage: ${TOTAL}%"
          # Hard gate since the v2.3.0 refactor: pure code is the only target with a test
          # runner, so a drop below the floor must fail the job, not just warn.
          if ! python3 -c 'import sys; sys.exit(0 if float(sys.argv[1]) >= 70 else 1)' "$TOTAL"; then
            echo "::error title=coverage::Core/Pure coverage dropped below 70% (${TOTAL}%)"
            exit 1
          fi
